  <script>

    const githubUsuario = "guilhermegdadiniz";
    const githubRepositorio = "atividadeseunicecarneiro";
    const githubBranch = "main";

    const pastas = [
      "1ano",
      "2ano",
      "3ano",
      "4ano",
      "5ano"
    ];

    let arquivos = [];

    function removerAcentos(texto) {

      return texto
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase();

    }

    function nomeArquivo(caminho) {

      let nome = caminho.split("/").pop();

      nome = nome.replace(/\.[^/.]+$/, "");

      nome = nome.replace(/[-_]/g, " ");

      return nome;

    }

    function descobrirAno(caminho) {

      const pasta = caminho.split("/")[0];

      const numero = pasta.replace("ano", "");

      return numero + "º ANO";

    }

    function descobrirPasta(caminho) {

      const partes = caminho.split("/");

      if (partes.length >= 3) {

        return partes
          .slice(1, -1)
          .join(" / ")
          .replace(/[-_]/g, " ");

      }

      return "";

    }

    async function carregarArquivos() {

      const resultados =
        document.getElementById("resultados");

      resultados.innerHTML =
        '<div class="carregando">⏳ Carregando atividades...</div>';

      try {

        const url =
          "https://api.github.com/repos/" +
          githubUsuario +
          "/" +
          githubRepositorio +
          "/git/trees/" +
          githubBranch +
          "?recursive=1";

        const resposta = await fetch(url);

        if (!resposta.ok) {

          throw new Error(
            "Não foi possível acessar o GitHub."
          );

        }

        const dados = await resposta.json();

        if (!dados.tree) {

          throw new Error(
            "A lista de arquivos não foi encontrada."
          );

        }

        arquivos =
          dados.tree.filter(arquivo => {

            if (arquivo.type !== "blob") {

              return false;

            }

            return pastas.some(pasta => {

              return arquivo.path.startsWith(
                pasta + "/"
              );

            });

          });

        arquivos.sort((a, b) => {

          return nomeArquivo(a.path)
            .localeCompare(
              nomeArquivo(b.path),
              "pt-BR"
            );

        });

        resultados.innerHTML = "";

        console.log(
          "Arquivos encontrados:",
          arquivos.length
        );

      }

      catch (erro) {

        console.error(erro);

        resultados.innerHTML =
          '<div class="nenhum-resultado">' +
          '⚠️ Não foi possível carregar as atividades.' +
          '<br><br>' +
          'Verifique sua conexão com a internet e tente novamente.' +
          '</div>';

      }

    }

    function realizarBusca() {

      const campo =
        document.getElementById("campoBusca");

      const resultados =
        document.getElementById("resultados");

      const listaAnos =
        document.getElementById("listaAnos");

      const busca =
        removerAcentos(
          campo.value.trim()
        );

      if (busca === "") {

        resultados.innerHTML = "";

        listaAnos.style.display = "block";

        return;

      }

      listaAnos.style.display = "none";

      const encontrados =
        arquivos.filter(arquivo => {

          const caminhoNormalizado =
            removerAcentos(
              arquivo.path
            );

          return caminhoNormalizado.includes(
            busca
          );

        });

      if (encontrados.length === 0) {

        resultados.innerHTML =
          '<div class="nenhum-resultado">' +
          '😕 Nenhuma atividade encontrada.' +
          '<br><br>' +
          'Tente outra palavra.' +
          '</div>';

        return;

      }

      let html =
        '<div class="resultado-titulo">' +
        '📚 ' +
        encontrados.length +
        ' atividade(s) encontrada(s)' +
        '</div>';

      encontrados.forEach(arquivo => {

        const nome =
          nomeArquivo(
            arquivo.path
          );

        const ano =
          descobrirAno(
            arquivo.path
          );

        const pasta =
          descobrirPasta(
            arquivo.path
          );

        const caminho =
          encodeURI(
            arquivo.path
          );

        html +=
          '<a class="resultado" href="' +
          caminho +
          '" target="_blank">' +

          '<div class="resultado-nome">' +
          '📄 ' +
          nome +
          '</div>' +

          '<div class="resultado-ano">' +
          '📚 ' +
          ano +
          '</div>';

        if (pasta) {

          html +=
            '<div class="resultado-pasta">' +
            '📂 ' +
            pasta +
            '</div>';

        }

        html +=
          '</a>';

      });

      resultados.innerHTML = html;

    }

    document
      .getElementById("campoBusca")
      .addEventListener(
        "input",
        realizarBusca
      );

    carregarArquivos();

  </script>
