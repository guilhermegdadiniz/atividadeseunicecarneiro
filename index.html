<!DOCTYPE html>

<head>

  <title>Acervo de Atividades - Escola Municipal Professora Eunice Carneiro</title>

  <style>

    body {
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      background: #fdf6e3;
    }

    /* LOGO */
    .logo {
      text-align: center;
      margin-top: 10px;
      margin-bottom: 15px;
    }

    .logo img {
      width: 180px;
      max-width: 80%;
    }

    /* TITULO */
    h1 {
      text-align: center;
      color: #333;
      font-size: 28px;
      margin: 10px auto 5px;
      max-width: 900px;
    }

    .subtitulo {
      text-align: center;
      color: #666;
      font-size: 18px;
      margin-bottom: 30px;
    }

    /* LISTA */
    ul {
      list-style: none;
      padding: 0;
      max-width: 700px;
      margin: 0 auto;
    }

    /* BOTÕES */
    li {
      margin: 14px 0;
    }

    li a {
      display: block;
      padding: 20px;
      border-radius: 18px;
      text-align: center;
      text-decoration: none;
      font-size: 21px;
      font-weight: bold;
      color: #333;
      background: white;

      box-shadow: 0 4px 8px rgba(0,0,0,0.15);

      transition: transform 0.2s, box-shadow 0.2s;
    }

    /* EFEITO AO PASSAR O MOUSE */
    li a:hover {
      transform: scale(1.03);
      box-shadow: 0 7px 12px rgba(0,0,0,0.20);
    }

    /* CORES DOS ANOS */

    .ano1 {
      background: #ffd6e7;
    }

    .ano2 {
      background: #ffe5b4;
    }

    .ano3 {
      background: #d8f3dc;
    }

    .ano4 {
      background: #cde7ff;
    }

    .ano5 {
      background: #e4d4ff;
    }

    /* RODAPE */

    .rodape {
      text-align: center;
      margin-top: 35px;
      color: #777;
      font-size: 14px;
    }

  </style>

</head>

<body>

  <!-- LOGO -->

  <!-- TITULO -->
