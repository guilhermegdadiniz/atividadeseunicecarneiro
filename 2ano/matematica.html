<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>2º Ano - Matemática</title>

  <style>

    body {
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      background: #fdf6e3;
    }

    .logo {
      text-align: center;
      margin-top: 10px;
      margin-bottom: 15px;
    }

    .logo img {
      width: 180px;
      max-width: 80%;
    }

    h1 {
      text-align: center;
      color: #333;
      font-size: 28px;
      margin: 10px auto 5px;
      max-width: 900px;
    }

    .subtitulo {
      text-align: center;
      color: #666;
      font-size: 18px;
      margin-bottom: 30px;
    }

    .voltar {
      max-width: 700px;
      margin: 0 auto 20px;
    }

    .voltar a {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 12px;
      background: white;
      color: #555;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 3px 6px rgba(0,0,0,0.12);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .voltar a:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 10px rgba(0,0,0,0.18);
    }

    ul {
      list-style: none;
      padding: 0;
      max-width: 700px;
      margin: 0 auto;
    }

    li {
      margin: 14px 0;
    }

    li a {
      display: block;
      padding: 20px;
      border-radius: 18px;
      text-align: center;
      text-decoration: none;
      font-size: 21px;
      font-weight: bold;
      color: #333;
      background: #ffd6e7;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    li a:hover {
      transform: scale(1.03);
      box-shadow: 0 7px 12px rgba(0,0,0,0.20);
    }

    .rodape {
      text-align: center;
      margin-top: 35px;
      color: #777;
      font-size: 14px;
    }

    @media (max-width: 600px) {

      body {
        padding: 15px;
      }

      h1 {
        font-size: 25px;
      }

      .subtitulo {
        font-size: 16px;
      }

      li a {
        font-size: 19px;
        padding: 18px;
      }

    }

  </style>

</head>

<body>

  <div class="logo">

    <img
      src="../logo.png"
      alt="Escola Municipal Professora Eunice Carneiro">

  </div>

  <h1>
    🔢 2º ANO - MATEMÁTICA
  </h1>

  <div class="subtitulo">
    📚 ACERVO DE ATIVIDADES 📚
  </div>

  <div class="voltar">

    <a href="./index.html">
      ← VOLTAR
    </a>

  </div>

  <ul id="listaAtividades">

  <li><a href="APRENDENDO%20AS%20HORAS.pdf" target="_blank">APRENDENDO AS HORAS</a></li>
  <li><a href="ADICAO%20COM%20RESERVA%20E%20SUBTRACAO%20COM%20EMPRESTIMO.pdf" target="_blank">ADIÇÃO COM RESERVA E SUBTRAÇÃO COM EMPRÉSTIMO</a></li>
  
  </ul>

  <div class="rodape">

    Escola Municipal Professora Eunice Carneiro

  </div>

</body>

</html>
