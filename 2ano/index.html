<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>2º Ano - Acervo de Atividades</title>

  <style>

    body {
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      background: #fdf6e3;
    }

    /* =========================
       CABEÇALHO
       ========================= */

    .logo {
      text-align: center;
      margin-top: 10px;
      margin-bottom: 15px;
    }

    .logo img {
      width: 180px;
      max-width: 80%;
    }

    h1 {
      text-align: center;
      color: #333;
      font-size: 28px;
      margin: 10px auto 5px;
      max-width: 900px;
    }

    .subtitulo {
      text-align: center;
      color: #666;
      font-size: 18px;
      margin-bottom: 30px;
    }

    /* =========================
       BOTÃO VOLTAR
       ========================= */

    .voltar {
      max-width: 700px;
      margin: 0 auto 20px;
    }

    .voltar a {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 12px;
      background: white;
      color: #555;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 3px 6px rgba(0,0,0,0.12);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .voltar a:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 10px rgba(0,0,0,0.18);
    }

    /* =========================
       LISTA
       ========================= */

    ul {
      list-style: none;
      padding: 0;
      max-width: 700px;
      margin: 0 auto;
    }

    li {
      margin: 14px 0;
    }

    li a {
      display: block;
      padding: 20px;
      border-radius: 18px;
      text-align: center;
      text-decoration: none;
      font-size: 21px;
      font-weight: bold;
      color: #333;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    li a:hover {
      transform: scale(1.03);
      box-shadow: 0 7px 12px rgba(0,0,0,0.20);
    }

    /* =========================
       CORES DOS ANOS
       ========================= */

    .ano1 {
      background: #ffd6e7;
    }

    .ano2 {
      background: #ffe5b4;
    }

    .ano3 {
      background: #d8f3dc;
    }

    .ano4 {
      background: #cde7ff;
    }

    .ano5 {
      background: #e4d4ff;
    }

    /* =========================
       RODAPÉ
       ========================= */

    .rodape {
      text-align: center;
      margin-top: 35px;
      color: #777;
      font-size: 14px;
    }

    /* =========================
       CELULAR
       ========================= */

    @media (max-width: 600px) {

      body {
        padding: 15px;
      }

      h1 {
        font-size: 25px;
      }

      .subtitulo {
        font-size: 16px;
      }

      li a {
        font-size: 19px;
        padding: 18px;
      }

    }

  </style>

</head>

<body>

  <!-- =========================
       LOGO
       ========================= -->

  <div class="logo">

    <img
      src="../logo.png"
      alt="Escola Municipal Professora Eunice Carneiro">

  </div>

  <!-- =========================
       TITULO
       ========================= -->

  <h1>
    🌟 ACERVO DE ATIVIDADES 🌟
  </h1>

  <div class="subtitulo">
    📚 ESCOLA MUNICIPAL PROFESSORA EUNICE CARNEIRO 📚
  </div>

  <!-- =========================
       VOLTAR
       ========================= -->

  <div class="voltar">

    <a href="../index.html">
      ← VOLTAR
    </a>

  </div>

  <!-- =========================
       ANOS
       ========================= -->

  <ul>

    <li>
      <a href="../1ano/index.html" class="ano1">
        🌟 1º ANO
      </a>
    </li>

    <li>
      <a href="../2ano/index.html" class="ano2">
        🌟 2º ANO
      </a>
    </li>

    <li>
      <a href="../3ano/index.html" class="ano3">
        🌟 3º ANO
      </a>
    </li>

    <li>
      <a href="../4ano/index.html" class="ano4">
        🌟 4º ANO
      </a>
    </li>

    <li>
      <a href="../5ano/index.html" class="ano5">
        🌟 5º ANO
      </a>
    </li>

  </ul>

  <!-- =========================
       RODAPÉ
       ========================= -->

  <div class="rodape">

    Escola Municipal Professora Eunice Carneiro

  </div>

</body>

</html>
